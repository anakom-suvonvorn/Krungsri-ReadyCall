bject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_S_TOT_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default scen" id="my-svg-flowchart-S-0" data-look="classic" transform="translate(136, 706.75)"><rect class="basic label-container" style="fill:#1f6feb !important;stroke:#0b3d91 !important" x="-128" y="-92.75" width="256" height="185.5"/><g class="label" style="color:#fff !important" transform="translate(-100, -78.75)"><rect/><foreignObject width="200" height="157.5"><div style="color: rgb(255, 255, 255) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p><b>SCENARIOS</b> - 3 scripted calls, end to end<br />pattheera_ipd - roadside_motor_claim - anonymous_declined<br />byte-identical on replay, with expect: blocks checked</p></span></div></foreignObject></g></g><g class="node default contract" id="my-svg-flowchart-C-1" data-look="classic" transform="translate(136, 460)"><rect class="basic label-container" style="fill:#eef4ff !important;stroke:#5b8def !important" x="-128" y="-104" width="256" height="208"/><g class="label" style="color:#0b2545 !important" transform="translate(-100, -90)"><rect/><foreignObject width="200" height="180"><div style="color: rgb(11, 37, 69) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#0b2545 !important" class="nodeLabel"><p><b>CONTRACT SUITES</b> - tests/contracts/<br />every adapter for a port must pass the SAME suite.<br />This is what makes hackathon-day swaps safe:<br />the new adapter either passes or it does not ship.</p></span></div></foreignObject></g></g><g class="node default unit" id="my-svg-flowchart-U-2" data-look="classic" transform="translate(136, 157)"><rect class="basic label-container" style="fill:#e9f7ef !important;stroke:#2f9e5f !important" x="-128" y="-59" width="256" height="118"/><g class="label" style="color:#08361d !important" transform="translate(-100, -45)"><rect/><foreignObject width="200" height="90"><div style="color: rgb(8, 54, 29) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#08361d !important" class="nodeLabel"><p><b>UNIT</b> - state machine, orchestrator, domain pack,<br />identity resolver, context + brief, agent language</p></span></div></foreignObject></g></g><g class="node default tot" id="my-svg-flowchart-TOT-7" data-look="classic" transform="translate(136, 897.25)"><rect class="basic label-container" style="fill:#fff4e6 !important;stroke:#e8a33d !important" x="-128" y="-47.75" width="256" height="95.5"/><g class="label" style="color:#4a2f00 !important" transform="translate(-100, -33.75)"><rect/><foreignObject width="200" height="67.5"><div style="color: rgb(74, 47, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#4a2f00 !important" class="nodeLabel"><p><b>161 tests, about 2 seconds</b><br />no services, no keys, no GPU, no network</p></span></div></foreignObject></g></g><g class="node default note" id="my-svg-flowchart-DET-8" data-look="classic" transform="translate(442, 157)"><rect class="basic label-container" style="fill:#fffbe6 !important;stroke:#d4a72c !important" x="-128" y="-149" width="256" height="298"/><g class="label" style="color:#4a3800 !important" transform="translate(-100, -135)"><rect/><foreignObject width="200" height="270"><div style="color: rgb(74, 56, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#4a3800 !important" class="nodeLabel"><p><b>why replays are byte-identical</b><br />ManualClock + DeterministicIds are INJECTED (D35).<br />Nothing calls datetime.now() or makes a random id<br />on its own, so the same scenario produces the same<br />output every time - which is what makes golden<br />comparison possible at all.</p></span></div></foreignObject></g></g><g class="node default note" id="my-svg-flowchart-HAND-9" data-look="classic" transform="translate(748, 157)"><rect class="basic label-container" style="fill:#fffbe6 !important;stroke:#d4a72c !important" x="-128" y="-92.75" width="256" height="185.5"/><g class="label" style="color:#4a3800 !important" transform="translate(-100, -78.75)"><rect/><foreignObject width="200" height="157.5"><div style="color: rgb(74, 56, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#4a3800 !important" class="nodeLabel"><p><b>grep -rn '# P1:' scripts/</b><br />lists every lifecycle step the runner still does<br />by hand - i.e. exactly what P2 and P3 take over.<br />The handover list is executable, not prose. (D36)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><f