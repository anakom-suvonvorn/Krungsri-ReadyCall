tant" class="nodeLabel"><p><b>WHO</b><br />name + segment<br />assurance badge<br /><b>identity control:</b><br />Confirmed / Not this<br />person / Third party<br />(D42)</p></span></div></foreignObject></g></g><g class="node default panel" id="my-svg-flowchart-MID-2" data-look="classic" transform="translate(173.28125, 360)"><rect class="basic label-container" style="fill:#eef4ff !important;stroke:#5b8def !important" x="-111.7890625" y="-81.5" width="223.578125" height="163"/><g class="label" style="color:#0b2545 !important" transform="translate(-83.7890625, -67.5)"><rect/><foreignObject width="167.578125" height="135"><div style="color: rgb(11, 37, 69) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#0b2545 !important" class="nodeLabel"><p><b>WHY + WHAT TO SAY</b><br />intent + urgency<br />Thai summary<br />suggested opening<br />recommended actions<br />(re-render on promotion)</p></span></div></foreignObject></g></g><g class="node default panel" id="my-svg-flowchart-RIGHT-3" data-look="classic" transform="translate(173.28125, 573)"><rect class="basic label-container" style="fill:#eef4ff !important;stroke:#5b8def !important" x="-115.28125" y="-81.5" width="230.5625" height="163"/><g class="label" style="color:#0b2545 !important" transform="translate(-87.28125, -67.5)"><rect/><foreignObject width="174.5625" height="135"><div style="color: rgb(11, 37, 69) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#0b2545 !important" class="nodeLabel"><p><b>EVIDENCE</b><br />live transcript, both sides<br />policy panel (gated)<br />provenance: says who,<br />and how old<br />keypad capture field (D43)</p></span></div></foreignObject></g></g></g></g><g class="node default bar" id="my-svg-flowchart-BAR-0" data-look="classic" transform="translate(551.5625, 386.25)"><rect class="basic label-container" style="fill:#1f6feb !important;stroke:#0b3d91 !important" x="-128" y="-59" width="256" height="118"/><g class="label" style="color:#fff !important" transform="translate(-100, -45)"><rect/><foreignObject width="200" height="90"><div style="color: rgb(255, 255, 255) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p><b>TOP BAR</b> - presence control<br />Available / Break / Lunch / Last call   |   mic + headset self-test</p></span></div></foreignObject></g></g><g class="node default ctl" id="my-svg-flowchart-CALLBAR-4" data-look="classic" transform="translate(857.5625, 386.25)"><rect class="basic label-container" style="fill:#e9f7ef !important;stroke:#2f9e5f !important" x="-128" y="-70.25" width="256" height="140.5"/><g class="label" style="color:#08361d !important" transform="translate(-100, -56.25)"><rect/><foreignObject width="200" height="112.5"><div style="color: rgb(8, 54, 29) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#08361d !important" class="nodeLabel"><p><b>CALL CONTROL</b> - Accept / Hold / Mute / Transfer / Hang up<br />SIP.js over WSS, WebRTC through the agent headset</p></span></div></foreignObject></g></g><g class="node default note" id="my-svg-flowchart-WHY-5" data-look="classic" transform="translate(1163.5625, 386.25)"><rect class="basic label-container" style="fill:#fffbe6 !important;stroke:#d4a72c !important" x="-128" y="-92.75" width="256" height="185.5"/><g class="label" style="color:#4a3800 !important" transform="translate(-100, -78.75)"><rect/><foreignObject width="200" height="157.5"><div style="color: rgb(74, 56, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#4a3800 !important" class="nodeLabel"><p><b>the timeline is visible on purpose (D18)</b><br />'context ready at 0.4s, before the phone rang'<br />If the system cannot explain why it did something,<br />it is not finished.</p></span></div></foreignObject></g></g></g></g><g class="node default key" id="my-svg-flowchart-NO-6" data-look="classic" transform="translate(1504.5625, 386.25)"><rect class="basic label-container" style="fill:#fff4e6 !important;stroke:#e8a33d !important" x="-128" y="-115.25" width="256" height="230.5"/><g class="label" style="color:#4a2f00 !important" transform="translate(-100, -101.25)"><rect/><foreignObject width="200" height="202.5"><div style="color: rgb(74, 47, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#4a2f00 !important" class="nodeLabel"><p><b>what is deliberately NOT here:</b> a desk phone,<br />a separate softphone app, an install, a second screen<br />to alt-tab to. The correction that produced this:<br />the workstation is not an info screen NEXT TO the<br />phone - it is the call centre.</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5b8def" stop-opacity="1"/><stop offset="100%" stop-color="hsl(33.6, 60%, 85.0980392157%)" stop-opacity="1"/></linearGradient></svg>