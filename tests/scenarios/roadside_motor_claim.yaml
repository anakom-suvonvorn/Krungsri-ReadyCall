# Scenario 2 - the roadside motor claim. THE BASE CASE (D19).
#
# Someone has just had an accident. They are standing next to a dented car, digging the
# policy documents out of the glovebox, and dialling the number printed on them. No app,
# no intent record, and identity is only a guess from caller ID (D20).
#
# This scenario exercises, in one run: the cold-call path, the product-line DID as a
# free intent signal, ANI-based probable identity, and (from P2) urgency-driven
# matching - a caller at a crash site must not queue behind a renewal question.

name: roadside_motor_claim
description: "Accident just happened; dialled the number on the car documents; no app"

entry:
  channel: product_did
  dialled_did: "+6621234111"     # a motor-claims DID - see config/dids.yaml.
                                 # NOTE: a general-hotline variant of this scenario is
                                 # the more common real case; the keypad menu (D37)
                                 # supplies the product line there instead.
  product_line: motor
  caller_number: "0898887777"    # stored as +66898887777: normalisation must work
  # NOTE: deliberately no customer_id. It is resolved from ANI, not asserted.

# The motor DID already gave the product line, so step 1 is skipped and the caller
# presses straight into the motor reason menu: 1 = แจ้งอุบัติเหตุ.
menu:
  path: ["1"]

consent:
  - recording
  - ai_processing

agent: A001

expect:
  state: closed
  assurance: l1_probable     # caller ID matched, but nothing verified it (D20)
  queue: q_motor_claim       # from the menu, before a word was transcribed (D37)
  intent: motor.claim.accident

intake:
  turns:
    - text: "รถผมเพิ่งชนมาครับ ตอนนี้อยู่ถนนพระราม 9 ใกล้แยกรัชดา"
      t_start_ms: 0
      t_end_ms: 4200
      confidence: 0.88
    - text: "ไม่มีใครเจ็บครับ แต่รถหน้าบุบและขับต่อไม่ได้"
      t_start_ms: 4800
      t_end_ms: 8600
      confidence: 0.9
    - text: "ทะเบียน กข 1234 กรุงเทพครับ ต้องทำอย่างไรต่อ"
      t_start_ms: 9200
      t_end_ms: 13000
      confidence: 0.85

timing:
  connect: 1.0
  ivr: 5.0          # the DID gave the product line, so step 1 of the menu is skipped
  per_turn: 4.5
  wait: 12.0        # high urgency: should wait less than a routine caller
  offer: 5.0
  call: 300.0
  acw: 60.0         # a claim needs real after-call work (D33)

