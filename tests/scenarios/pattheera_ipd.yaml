# Scenario 1 - the pitch's own example (Krungsri.pdf p.7).
#
# Khun Pattheera taps Contact on Krungsri Health Plan A, being admitted tomorrow, wants
# to confirm room and board. The happy path: app origin, verified identity, consent
# given, intake recorded.

name: pattheera_ipd
description: "In-app tap on Health Plan A; admitted tomorrow; room and board question"

entry:
  channel: in_app
  customer_id: C000001
  product_code: KS-HEALTH-A
  product_line: health
  # The app knows the section she tapped Contact from - she was reading the
  # hospitalisation coverage page - so BOTH menu steps are answered before the call is
  # even placed (D6, D37). This is the app path at its best.
  app_intent: health.claim.notify
  caller_number: "+66812345678"

# Health content, so health_data is consented separately from ai_processing (D14).
consent:
  - recording
  - ai_processing
  - health_data

agent: A006

# No menu: the app said which plan, so asking would be bad service (D37).
expect:
  state: closed
  assurance: l3_verified     # the app's correlation token binds identity (D4)
  queue: q_claims        # from the app's screen context, no keypresses needed
  intent: health.claim.notify

intake:
  turns:
    - text: "สวัสดีครับ พรุ่งนี้ผมต้องไปนอนโรงพยาบาลกรุงเทพครับ"
      t_start_ms: 0
      t_end_ms: 3600
      confidence: 0.94
    - text: "อยากทราบว่าค่าห้องที่ประกันจ่ายให้คือวันละเท่าไหร่"
      t_start_ms: 4100
      t_end_ms: 8200
      confidence: 0.91
    - text: "แล้วต้องเตรียมเอกสารอะไรบ้างสำหรับเคลมครับ"
      t_start_ms: 8900
      t_end_ms: 12400
      confidence: 0.89

timing:
  connect: 1.0
  ivr: 9.0
  per_turn: 4.5
  wait: 22.0
  offer: 7.0
  call: 240.0
  acw: 35.0

