# What the agent should actually DO on this call, per intent (`D56`, `D118`).
#
# This closes `Q19`. The steps lived in `_PLAYBOOKS` inside `services/brief/builder.py`,
# which was always a `D28` violation with a note on it - insurance content in a service.
# The broker rewrite (`D117`) would have doubled the size of that dict, so it moved here
# instead, the same way the challenge list moved in `D72`.
#
# Each entry is an ordered list of steps. `needs` is the assurance level required before
# the step may be SHOWN (`D74`: assurance gates what the agent may say and do, never what
# they may see - so a gated step is one that involves acting on the policy, not one that
# involves reading it):
#
#   l0  - always shown. Anything you would do for a stranger.
#   l2  - shown only once identity is established. Anything that acts on, quotes from, or
#         changes a policy.
#
# The brief builder prepends "ยืนยันตัวตนผู้ติดต่อก่อนให้ข้อมูลกรมธรรม์" as step 0 whenever
# disclosure is not yet permitted, so no playbook needs to include it.
#
# THE BROKER RULE THAT SHAPES ALL OF THESE (`D117`, `MARKET_FACTS` section 4): a broker
# does not underwrite, price, or adjudicate claims. So no step here ever says "approve",
# "the claim is covered", or "the premium will be" - the steps gather, explain what is on
# the record, and hand over. Where the insurer owns the outcome, the last step says so.

version: 1

playbooks:
