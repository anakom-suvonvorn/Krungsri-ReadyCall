# ---------------------------------------------------------------------------------------
# WHY THE CALL IS BEING HANDED OVER
# ---------------------------------------------------------------------------------------
#
# A closed list, for `IntentCode`'s reason: a free-text field here becomes twelve spellings
# of "claim" and no way to count them. `requires_policy: true` means the reason only makes
# sense about cover the customer actually holds, so the broker is offered the **policy's
# own carrier** rather than the market menu — handing a claim to a company that did not
# write the policy is not a handoff, it is a wrong number.
#
# None of these says *approved*, *is covered*, or quotes a premium. That is the line
# `D117` drew and this file must not cross it: we gather and pass on, they decide.

handoff_reasons:
  - code: claim_adjudication
    label_th: "การพิจารณาและจ่ายค่าสินไหม"
    requires_policy: true
  - code: coverage_ruling
    label_th: "การตีความความคุ้มครองในกรมธรรม์"
    requires_policy: true
  - code: preauth
    label_th: "ขออนุมัติค่ารักษาล่วงหน้า (Fax Claim)"
    requires_policy: true
  - code: policy_issued_by_them
    label_th: "กรมธรรม์ออกโดยบริษัทนั้นโดยตรง"
    requires_policy: true
  - code: service_complaint
    label_th: "ร้องเรียนการบริการของบริษัทประกัน"
    requires_policy: false
  - code: other
    label_th: "เรื่องอื่นๆ ที่เป็นอำนาจของบริษัทประกัน"
    requires_policy: false
