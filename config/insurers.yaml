# insurers.yaml — the companies a broker can hand a call TO, and why (`D124`)
#
# `D117` made claims a HANDOFF: adjudicating and paying them is the insurer's duty, not
# ours, and every such intent already carries `handoff_to_insurer: true` onto the broker's
# screen before they speak. This file is what turns that banner into something the broker
# can actually DO.
#
# ---------------------------------------------------------------------------------------
# THE RECORD BEATS THE MENU
# ---------------------------------------------------------------------------------------
#
# This list is a **menu**, not a whitelist. The carrier that underwrote the customer's
# policy comes from `Policy.insurer` and is offered first whether or not it appears here —
# because on hackathon day the real data arrives carrying carriers nobody has typed into
# this file, and a broker who cannot hand a claim to the company that actually wrote the
# policy has no product at all. A startup guard that demanded every fixture carrier be
# listed here would refuse to boot on the real extract, which is the failure the whole
# `CoreDataProvider` seam exists to prevent (`D3`).
#
# So: the list below is what the broker sees when the call is NOT about a policy we hold.
#
# ---------------------------------------------------------------------------------------
# WHY THESE NAMES
# ---------------------------------------------------------------------------------------
#
# Real carriers with real 2025 market share, from the orientation deck (`MARKET_FACTS` §8).
# A judge from Krungsri Auto Broker recognises them on sight, and a demo full of
# "Insurer A / Insurer B" throws away the one piece of realism that costs nothing.
#
# ⚠️ **Allianz Ayudhya is the Krungsri-affiliated carrier and is deliberately one row
# among several.** A broker whose affiliate always wins is not a broker (`D117`).

version: 1

insurers:
