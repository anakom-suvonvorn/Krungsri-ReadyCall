[project]
name = "readycall"
version = "0.1.0"
description = "Krungsri ReadyCall - an AI context layer for insurance service calls"
readme = "README.md"
authors = [
    { name = "HACK VIDVA" },
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "tzdata>=2026.3",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=44.0",
]

[project.optional-dependencies]
# Heavier stacks are opt-in so `uv sync` stays fast and the STT worker does not
# have to install the web stack (D2). Added phase by phase.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "websockets>=13"]
# db was folded into the base dependencies when P2c landed.
#
# `ml` is the STT box's stack and lands on nothing else (`D2`). torch comes from the CUDA
# index configured below, NOT from PyPI: the PyPI wheel is CPU-only and would silently
# give us a Whisper that runs at a tenth of the speed with no error anywhere (`D95`).
ml = [
    "torch>=2.6",
    "transformers>=4.44",
    "faster-whisper>=1.1",
    "onnxruntime>=1.20",
    "silero-vad>=5.1",
    "soundfile>=0.12",
]
asr = [
    "nemo-toolkit[asr]>=2.0",
]
s3 = [
    "boto3>=1.35",
]
# The two LLM SDKs (`D29`, `D119`). Opt-in for the same reason as the rest: the system's
# default provider is rule-based and needs neither, so a clone that only wants to run the
# demo installs nothing. One extra covers both because the comparison the pitch promises
# needs both installed at once.
llm = [
    "anthropic>=0.40",
    "openai>=1.55",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260815",
    "httpx2>=2.12.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "readycall"
module-root = "src"

# --- where torch comes from (`D95`) ---------------------------------------------------
#
# PyPI's `torch` is the CPU build. Installing it would produce a working system that is
# quietly ten times too slow, with `torch.cuda.is_available()` returning False and nothing
# raising - the exact "confident, plausible, wrong" shape this project keeps meeting
# (`B3`, `B12`). So torch is pinned to the CUDA 12.8 index instead.
#
# `explicit = true` means ONLY the packages named in [tool.uv.sources] are looked up here;
# everything else still resolves from PyPI. Without it, uv would search this index for
# every dependency and find stale mirrors of some of them.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # silero-vad loads its bundled TorchScript model with `torch.jit.load`, which torch
    # 2.11 deprecates. It is third-party code doing the deprecated thing, so there is
    # nothing here to act on - but under a blanket `error` it became an exception during
    # model load, which the VAD contract suite then read as "silero is not installed" and
    # SKIPPED. The real detector would have gone untested with a green suite saying so.
    # Narrow on purpose: only this warning, only this call.
    "ignore:`torch.jit.load` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# docs/explanations/* are verbatim teaching notes; reformatting their code samples
# would quietly rewrite a record the user asked to keep word for word.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["readycall"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

# The `ml` extra's packages ship no type information. Scoped to exactly these three rather
# than a blanket `ignore_missing_imports`, so a genuinely missing stub anywhere else still
# fails - and both adapters keep every value they take out of these libraries behind an
# explicit `Any`, so nothing untyped leaks past the adapter boundary.
[[tool.mypy.overrides]]
# `torch` was missing from this list until 2026-09-07 and mypy passed anyway, because
# the machine that ran it happened to have the `ml` extra installed. A `uv sync`
# without that extra - which is what CI does - made five files fail at once. A type
# check that depends on an optional extra being present is checking the machine.
module = ["torch.*", "silero_vad.*", "faster_whisper.*", "transformers.*", "nemo.*"]
ignore_missing_imports = true

# boto3 ships no py.typed either (`boto3-stubs` is a separate, very large package). Same
# rule as above: the client is held as an explicit `Any` inside `S3BlobStorage` and every
# value taken out of it is converted at that boundary, so nothing untyped leaves the
# adapter.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# The LLM SDKs, same rule again: both are behind the `llm` extra and CI does not install
# it, and both adapters hold the client as an explicit `Any` and convert every value at
# the boundary, so no untyped object reaches `services/`.
[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true
